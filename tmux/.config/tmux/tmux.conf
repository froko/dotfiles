# ==========================================
# General
# ==========================================
set -g prefix C-a
unbind C-b

set -g mouse on
set -g status-position top
set -g status-justify left
set -g base-index 1
set -g detach-on-destroy off
set -g default-terminal "screen-256color"
set -g allow-passthrough on

setw -g pane-base-index 1
set-option -g focus-events on
set-window-option -g mode-keys vi

# ==========================================
# Key Bindings
# ==========================================
bind r source-file ~/.config/tmux/tmux.conf

# Split panes
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Resize panes (vim-style, repeatable)
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

# Vi copy mode
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection
unbind -T copy-mode-vi MouseDragEnd1Pane

# Session picker (sesh + fzf)
bind-key T run-shell "sesh connect \"$(
	sesh list | fzf-tmux -p 80%,60% \
		--no-sort --border-label ' sesh ' --prompt '⚡  ' \
)\""

# Popups & pane management
bind-key G display-popup -w 80% -h 90% -d "#{pane_current_path}" -E "lazygit"
bind-key E display-popup -w 80% -h 90% -d "#{pane_current_path}" -E "tmux new-session -c '#{pane_current_path}' 'exec yazi' \\; set detach-on-destroy on \\; set status off"
bind-key x kill-pane

# ==========================================
# Plugins
# ==========================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# ==========================================
# Catppuccin Theme
# ==========================================
set -g @catppuccin_window_status_style "slanted"
set -g @catppuccin_window_text " #W "
set -g @catppuccin_window_number " #I "
set -g @catppuccin_window_current_text " #W "
set -g @catppuccin_window_current_number " #I "
set -g @catppuccin_window_current_text_color "#{@thm_surface_1}"
set -g @catppuccin_window_current_number_color "#{@thm_blue}"

# ==========================================
# Plugin Initialization
# ==========================================
# Run synchronously so plugin styles load before our overrides below
run '~/.tmux/plugins/tpm/tpm'
set -g @continuum-restore 'on'

# ==========================================
# Status Line Overrides
# ==========================================
set -g status-left ""
set -g status-right ""

# Reset catppuccin's message styles to fix command prompt overlapping
set-option -ug message-format
set-option -ug message-style
set-option -ug message-command-style
set -g message-style "bg=#313244,fg=#cdd6f4,align=left,fill=#313244"
set -g message-command-style "bg=#313244,fg=#cdd6f4,align=left,fill=#313244"
